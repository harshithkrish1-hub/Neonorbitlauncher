
name: Build NeonOrbit APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NeonOrbitLauncher.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

          - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: unzip -q NeonOrbitLauncher.zip -d source

      - name: Build APK
        working-directory: source/NeonOrbitLauncher
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NeonOrbitLauncher-APK
          path: source/NeonOrbitLauncher/app/build/outputs/apk/debug/app-debug.apk
